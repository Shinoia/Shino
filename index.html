<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
<title>Shino</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111'/%3E%3Ctext x='32' y='45' font-family='system-ui,sans-serif' font-size='38' font-weight='700' text-anchor='middle' fill='%23fff'%3ES%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #fafafa; --surface: #ffffff; --line: #e8e8e8; --line-strong: #d4d4d4;
    --text: #111111; --muted: #8a8a8a; --soft: #f2f2f2;
    --primary: #111111; --on-primary: #ffffff;
    --danger: #d93a3a; --ok: #1f9d55; --focus: #11111122;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0d; --surface: #151517; --line: #242427; --line-strong: #34343a;
      --text: #ededed; --muted: #7d7d85; --soft: #1c1c1f;
      --primary: #ededed; --on-primary: #0c0c0d;
      --danger: #ff6b6b; --ok: #4ade80; --focus: #ffffff1f;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100dvh;
    -webkit-font-smoothing: antialiased; font-size: 15px;
  }
  .wrap {
    max-width: 760px; margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 20px max(48px, env(safe-area-inset-bottom));
  }

  /* ---------- marca ---------- */
  .marca {
    font-weight: 700; letter-spacing: -0.045em; color: var(--text); text-decoration: none;
    font-size: 22px; line-height: 1;
  }
  .marca::after { content: "."; color: var(--muted); }

  /* ---------- botões ---------- */
  button {
    font: inherit; font-size: 14px; font-weight: 550; border-radius: 10px; cursor: pointer;
    border: 1px solid transparent; padding: 0 16px; height: 40px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .15s, border-color .15s, opacity .15s, transform .05s;
  }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .45; cursor: default; }
  .b-pri { background: var(--primary); color: var(--on-primary); }
  .b-pri:hover:not(:disabled) { opacity: .88; }
  .b-sec { background: transparent; color: var(--text); border-color: var(--line-strong); }
  .b-sec:hover:not(:disabled) { background: var(--soft); }
  .b-ico {
    background: transparent; color: var(--muted); width: 36px; height: 36px; padding: 0; border-radius: 9px;
  }
  .b-ico:hover { background: var(--soft); color: var(--text); }
  .b-ico.perigo:hover { color: var(--danger); }
  svg { width: 18px; height: 18px; flex: none; }
  input {
    font: inherit; background: var(--surface); color: var(--text);
    border: 1px solid var(--line-strong); border-radius: 10px; height: 40px; padding: 0 12px; outline: 0;
  }
  input:focus { border-color: var(--text); box-shadow: 0 0 0 3px var(--focus); }
  input::placeholder, textarea::placeholder { color: var(--muted); }

  /* ---------- cabeçalho da pasta ---------- */
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .caminho { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1; }
  .pasta { color: var(--muted); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pasta b { color: var(--text); font-weight: 550; }

  /* ---------- caixa (texto + arrastar) ---------- */
  .caixa {
    position: relative; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); transition: border-color .15s, box-shadow .15s;
  }
  .caixa:focus-within { border-color: var(--line-strong); box-shadow: 0 0 0 4px var(--focus); }
  .caixa.on { border: 1px dashed var(--text); }
  .caixa textarea {
    display: block; width: 100%; min-height: 180px; resize: vertical; border: 0; outline: 0;
    background: transparent; color: var(--text); padding: 16px 18px; tab-size: 4;
    font-family: ui-monospace, "SF Mono", Consolas, "Courier New", monospace; font-size: 13.5px; line-height: 1.6;
  }
  .caixa textarea::placeholder { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.6; }
  .caixa .solte {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center; gap: 10px;
    font-weight: 600; font-size: 16px; color: var(--text); background: var(--surface);
    border-radius: var(--radius); pointer-events: none;
  }
  .caixa.on .solte { display: flex; }
  .barra { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  .barra input { flex: 1; min-width: 0; background: var(--bg); }

  /* ---------- fila de envio ---------- */
  .fila { margin: 12px 2px 0; font-size: 13px; display: grid; gap: 4px; }
  .fila:empty { display: none; }
  .fila div { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fila .ok { color: var(--ok); } .fila .erro { color: var(--danger); }

  /* ---------- lista ---------- */
  .lista-topo {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 34px 2px 10px; font-size: 13px; color: var(--muted);
  }
  .lista-topo b { color: var(--text); font-weight: 600; font-size: 14px; }
  .lista { border-top: 1px solid var(--line); }
  .item {
    display: grid; grid-template-columns: 42px 1fr auto; align-items: center; gap: 14px;
    padding: 12px 2px; border-bottom: 1px solid var(--line);
  }
  .ext {
    width: 42px; height: 42px; border-radius: 10px; background: var(--soft); color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; overflow: hidden;
  }
  .info { min-width: 0; }
  .info a {
    color: var(--text); text-decoration: none; font-weight: 500; display: block;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .info a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .previa {
    margin-top: 6px; font-size: 13.5px; line-height: 1.5; color: var(--text); opacity: .85;
    max-height: 4.5em; overflow: hidden;
    word-break: break-word; white-space: pre-wrap; cursor: pointer;
  }
  .previa:empty { display: none; }
  .info .previa a { display: inline; white-space: pre-wrap; overflow: visible; font-weight: 400; word-break: break-all; }
  .item .ext { align-self: start; }
  .info a:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 4px; }
  .previa a, .visor pre a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  .visor pre { white-space: pre-wrap; word-break: break-word; }
  .acts { display: flex; gap: 2px; }
  .vazio { padding: 40px 0; text-align: center; color: var(--muted); font-size: 14px; }

  .espaco { margin: 26px 2px 0; font-size: 12.5px; color: var(--muted); display: grid; gap: 8px; }
  .espaco:empty { display: none; }
  .medidor { height: 4px; border-radius: 4px; background: var(--soft); overflow: hidden; }
  .medidor i { display: block; height: 100%; background: var(--muted); border-radius: 4px; }
  .msg {
    display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start;
    padding: 14px 2px; border-bottom: 1px solid var(--line);
  }
  .msg-corpo { min-width: 0; cursor: pointer; }
  .msg .previa { margin: 0; max-height: 7.5em; opacity: 1; font-size: 15px; }
  .msg .previa a { white-space: pre-wrap; word-break: break-all; }
  .msg .meta { margin-top: 6px; }
  .caixa .barra { justify-content: flex-end; }
  .caixa .barra button { min-width: 120px; }
  /* ---------- tela inicial ---------- */
  .home { min-height: 72dvh; display: flex; flex-direction: column; justify-content: center; max-width: 420px; margin: 0 auto; }
  .home .marca { font-size: 44px; }
  .home p { color: var(--muted); line-height: 1.6; margin: 14px 0 26px; }
  .linha { display: flex; gap: 8px; }
  .linha input { flex: 1; min-width: 0; }
  .aviso { font-size: 13px !important; margin-top: 18px !important; }
  .agradece {
    font-size: 12.5px !important; margin: 26px 0 0 !important; padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .agradece b { color: var(--text); font-weight: 550; }

  /* ---------- visualizador ---------- */
  .fundo {
    position: fixed; inset: 0; background: #0000008c; display: flex; align-items: center;
    justify-content: center; padding: 20px; z-index: 20; backdrop-filter: blur(2px);
  }
  .fundo[hidden] { display: none; }
  .visor {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    width: 100%; max-width: 880px; max-height: 88dvh; display: flex; flex-direction: column; overflow: hidden;
  }
  .visor .topo { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--line); }
  .visor .topo b { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .visor pre {
    margin: 0; padding: 16px; overflow: auto; white-space: pre; tab-size: 4;
    font-family: ui-monospace, "SF Mono", Consolas, "Courier New", monospace; font-size: 13px; line-height: 1.6;
  }

  /* ---------- aviso flutuante ---------- */
  .toast {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translate(-50%, 10px);
    background: var(--primary); color: var(--on-primary); padding: 10px 16px; border-radius: 10px;
    font-size: 14px; font-weight: 500; opacity: 0; transition: .2s; pointer-events: none; z-index: 30;
    max-width: calc(100% - 40px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.erro { background: var(--danger); color: #fff; }

  /* ---------- celular ---------- */
  @media (max-width: 600px) {
    body { font-size: 16px; }
    .wrap { padding-left: 16px; padding-right: 16px; padding-top: max(20px, env(safe-area-inset-top)); }
    input { font-size: 16px; height: 44px; }          /* evita zoom automático no iPhone */
    button { height: 44px; }
    .b-ico { width: 40px; height: 40px; }
    .so-pc { display: none; }
    .caixa textarea { min-height: 150px; padding: 14px; font-size: 14px; }
    .barra { flex-wrap: wrap; }
    .barra input { flex-basis: 100%; }
    .barra button { flex: 1; }
    .item { grid-template-columns: 38px 1fr; gap: 12px; row-gap: 6px; }
    .ext { width: 38px; height: 38px; }
    .acts { grid-column: 2; margin-left: -8px; }
    .home .marca { font-size: 38px; }
    .linha { flex-direction: column; }
    .linha input { flex: none; }
    .fundo { padding: 0; align-items: stretch; }
    .visor { max-height: none; border-radius: 0; border: 0; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<div class="fundo" id="fundo" hidden>
  <div class="visor">
    <div class="topo">
      <b id="visorNome"></b>
      <button class="b-sec" id="visorCopiar">Copiar texto</button>
      <button class="b-ico" id="visorFechar" title="Fechar" aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <pre id="visorTexto"></pre>
  </div>
</div>

<script type="module">
// =====================================================================
//  CONFIGURAÇÃO — cole aqui o endereço do Apps Script (termina em /exec)
// =====================================================================
const API = "https://script.google.com/macros/s/AKfycbxwtt1pQe2rdhVoCICCAkjjmg_74T2o11zcWHJvv1QtDFlZqbQH24Xm20wxgXejVnXr5A/exec";
// =====================================================================


const app = document.getElementById("app");

// ---------- comunicação com o Apps Script ----------
async function api(dados, metodo = "GET") {
  let resp;
  try {
    resp = metodo === "GET"
      ? await fetch(API + "?" + new URLSearchParams(dados))
      : await fetch(API, { method: "POST", body: JSON.stringify(dados) }); // text/plain: sem pré-verificação CORS
  } catch {
    throw new Error("Sem conexão com o servidor");
  }
  let json;
  try { json = await resp.json(); } catch { throw new Error("Resposta inválida do servidor"); }
  if (!json.ok) throw new Error(json.erro || "Erro desconhecido");
  return json;
}
const linkVer = id => `https://drive.google.com/file/d/${id}/view`;
const linkBaixar = id => `https://drive.google.com/uc?export=download&id=${id}`;
const linkDaPasta = () => location.origin + basePath() + pasta;
// Textos: o link leva para o próprio site (abre o texto na página). Outros arquivos: Drive.
const linkDoArquivo = a => ehTexto(a) ? `${linkDaPasta()}#${a.id}` : linkVer(a.id);

// ---------- ícones ----------
const ic = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICONE = {
  ver: ic('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'),
  link: ic('<path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/>'),
  baixar: ic('<path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>'),
  apagar: ic('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>'),
  copiar: ic('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>'),
  clipe: ic('<path d="m21 11-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8L13.2 3.2a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6L15 6.6"/>'),
  enviar: ic('<path d="M12 19V5m0 0-6 6m6-6 6 6"/>'),
};

// ---------- utilidades ----------
// Em usuario.github.io/repositorio/pasta  -> ignora o nome do repositório.
// Em domínio próprio (ex: shino.com.br/pasta) -> usa o primeiro trecho.
function lerPasta() {
  let partes = location.pathname.split("/").filter(Boolean);
  if (location.hostname.endsWith("github.io")) partes = partes.slice(1);
  partes = partes.filter(p => p !== "index.html" && p !== "404.html");
  return limparPasta(decodeURIComponent(partes[0] || ""));
}
function basePath() {
  if (location.hostname.endsWith("github.io")) {
    const repo = location.pathname.split("/").filter(Boolean)[0];
    return repo ? `/${repo}/` : "/";
  }
  return "/";
}
const semAcento = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "");
function limparPasta(t) {
  return semAcento(t).toLowerCase().replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
}
function limparArquivo(t) {
  return semAcento(t).replace(/\s+/g, "_").replace(/[^A-Za-z0-9._-]/g, "").replace(/^\.+/, "").slice(0, 150) || "arquivo";
}
function tamanho(b) {
  if (b == null) return "";
  if (b < 1024) return b + " B";
  if (b < 1024 ** 2) return (b / 1024).toFixed(1) + " KB";
  if (b < 1024 ** 3) return (b / 1024 ** 2).toFixed(1) + " MB";
  return (b / 1024 ** 3).toFixed(2) + " GB";
}
function extensao(nome) {
  const i = nome.lastIndexOf(".");
  return i > 0 ? nome.slice(i + 1).slice(0, 4) : "—";
}
function quando(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "agora";
  if (s < 3600) return `há ${Math.floor(s / 60)} min`;
  if (s < 86400) return `há ${Math.floor(s / 3600)} h`;
  if (s < 86400 * 7) return `há ${Math.floor(s / 86400)} d`;
  return new Date(iso).toLocaleDateString("pt-BR");
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function toast(msg, tipo) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("erro", tipo === "erro");
  t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
}
async function copiar(texto, msg = "Copiado") {
  try { await navigator.clipboard.writeText(texto); toast(msg); }
  catch { prompt("Copie o texto abaixo:", texto); }
}
function paraBase64(blob) {
  return new Promise((ok, falha) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).slice(String(r.result).indexOf(",") + 1));
    r.onerror = () => falha(new Error("Não foi possível ler o arquivo"));
    r.readAsDataURL(blob);
  });
}

// ---------- tela inicial (sem pasta) ----------
function telaInicial() {
  const sugestao = Math.random().toString(36).slice(2, 8) + "-" + Math.random().toString(36).slice(2, 6);
  app.innerHTML = `
    <div class="home">
      <div class="marca">Shino</div>
      <p>Guarde e compartilhe textos por link. Escolha um nome de pasta — quem tiver o link pode ler e escrever.</p>
      <div class="linha">
        <input id="nome" placeholder="nome-da-pasta" value="${sugestao}" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="b-pri" id="ir">Abrir pasta</button>
      </div>
      <p class="aviso">Pastas não têm senha: prefira nomes difíceis de adivinhar.</p>
      <p class="agradece">Agradecimento a um cannabico · <b>@cqcfoda</b></p>
    </div>`;
  const campo = document.getElementById("nome");
  const ir = () => {
    const p = limparPasta(campo.value);
    if (p) location.href = basePath() + p;
  };
  document.getElementById("ir").onclick = ir;
  campo.onkeydown = e => { if (e.key === "Enter") ir(); };
  if (matchMedia("(min-width: 601px)").matches) campo.select();
}

// ---------- tela da pasta ----------
let pasta = "";
let arquivos = [];

function telaPasta() {
  app.innerHTML = `
    <header>
      <div class="caminho">
        <a href="${basePath()}" class="marca">Shino</a>
        <span class="pasta">/ <b>${esc(pasta)}</b></span>
      </div>
      <button class="b-ico" id="copiarPasta" title="Copiar link desta pasta" aria-label="Copiar link desta pasta">${ICONE.link}</button>
    </header>

    <div class="caixa">
      <textarea id="textoConteudo" spellcheck="false" placeholder="Escreva ou cole seu texto aqui…"></textarea>
      <div class="barra">
        <button class="b-pri" id="salvarTexto">Salvar</button>
      </div>
    </div>

    <div class="lista-topo">
      <b>Textos</b>
      <span id="total"></span>
    </div>
    <div class="lista" id="lista"><div class="vazio">Carregando…</div></div>
    <div class="espaco" id="espaco"></div>`;

  document.getElementById("copiarPasta").onclick = () => copiar(location.href.split("#")[0], "Link da pasta copiado");

  const tConteudo = document.getElementById("textoConteudo");
  // Tab faz recuo; Ctrl+Enter salva
  tConteudo.addEventListener("keydown", e => {
    if (e.key === "Tab") {
      e.preventDefault();
      tConteudo.setRangeText("    ", tConteudo.selectionStart, tConteudo.selectionEnd, "end");
    } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault(); salvar();
    }
  });

  async function salvar() {
    const conteudo = tConteudo.value;
    if (!conteudo.trim()) { tConteudo.focus(); return toast("Escreva algo antes de salvar", "erro"); }
    const botao = document.getElementById("salvarTexto");
    botao.disabled = true; botao.textContent = "Salvando…";
    const ok = await enviarTexto(conteudo);
    botao.disabled = false; botao.textContent = "Salvar";
    if (ok) tConteudo.value = "";
  }
  document.getElementById("salvarTexto").onclick = salvar;

  carregar(true);
}

const dataHora = iso => new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });

async function carregar(registrarAcesso = false) {
  const lista = document.getElementById("lista");
  let r;
  try {
    r = await api({ acao: "listar", pasta, registrar: registrarAcesso ? "1" : "0", link: linkDaPasta() });
  } catch (e) {
    lista.innerHTML = `<div class="vazio">Erro ao carregar: ${esc(e.message)}</div>`;
    return;
  }
  arquivos = r.arquivos || [];
  document.getElementById("total").textContent =
    arquivos.length ? `${arquivos.length} ${arquivos.length === 1 ? "texto" : "textos"}` : "";
  if (r.limite) {
    const pct = Math.min(100, r.usado / r.limite * 100);
    document.getElementById("espaco").innerHTML =
      `<div class="medidor"><i style="width:${pct.toFixed(1)}%"></i></div>
       <span>Espaço do Shino: ${tamanho(r.usado)} de ${tamanho(r.limite)}</span>`;
  }

  if (!arquivos.length) {
    lista.innerHTML = `<div class="vazio">Nenhum texto ainda.</div>`;
    return;
  }
  lista.innerHTML = arquivos.map((a, i) => ehTexto(a) ? `
    <div class="msg">
      <div class="msg-corpo" data-abrir="${i}">
        <div class="previa" data-previa="${esc(a.id)}">${a.size > PREVIA_MAX ? "Texto longo — abra para ler" : "…"}</div>
        <div class="meta">${esc(quando(a.created))}${a.size > 2048 ? " · " + tamanho(a.size) : ""}</div>
      </div>
      <div class="acts">
        <button class="b-ico" data-copiartexto="${i}" title="Copiar texto" aria-label="Copiar texto">${ICONE.copiar}</button>
        <button class="b-ico" data-copiar="${i}" title="Copiar link" aria-label="Copiar link">${ICONE.link}</button>
        <button class="b-ico perigo" data-apagar="${i}" title="Apagar" aria-label="Apagar">${ICONE.apagar}</button>
      </div>
    </div>` : `
    <div class="msg">
      <div class="msg-corpo">
        <div class="previa"><a href="${esc(linkVer(a.id))}" target="_blank" rel="noopener">${esc(a.name)}</a></div>
        <div class="meta">${esc(quando(a.created))} · ${tamanho(a.size)}</div>
      </div>
      <div class="acts">
        <button class="b-ico" data-copiar="${i}" title="Copiar link" aria-label="Copiar link">${ICONE.link}</button>
        <button class="b-ico perigo" data-apagar="${i}" title="Apagar" aria-label="Apagar">${ICONE.apagar}</button>
      </div>
    </div>`).join("");

  lista.querySelectorAll("[data-abrir]").forEach(el =>
    el.onclick = e => {
      if (e.target.closest("a")) return; // clicou num link dentro do texto
      if (getSelection().toString()) return; // estava selecionando texto
      verTexto(arquivos[el.dataset.abrir]);
    });
  lista.querySelectorAll("[data-copiartexto]").forEach(b =>
    b.onclick = async () => {
      try { copiar(await lerTexto(arquivos[b.dataset.copiartexto].id), "Texto copiado"); }
      catch (e) { toast("Erro: " + e.message, "erro"); }
    });
  lista.querySelectorAll("[data-copiar]").forEach(b =>
    b.onclick = () => copiar(linkDoArquivo(arquivos[b.dataset.copiar]), "Link copiado"));
  lista.querySelectorAll("[data-apagar]").forEach(b =>
    b.onclick = async () => {
      const a = arquivos[b.dataset.apagar];
      if (!confirm("Apagar este texto?")) return;
      b.disabled = true;
      try {
        await api({ acao: "apagar", id: a.id, pasta }, "POST");
        toast("Apagado");
        carregar();
      } catch (e) {
        toast("Erro ao apagar: " + e.message, "erro"); b.disabled = false;
      }
    });
  carregarPrevias();
  abrirPeloEndereco();
}

// ---------- textos ----------
const PREVIA_MAX = 200 * 1024;
const EXT_TEXTO = new Set(("txt md markdown log csv tsv json xml yml yaml ini cfg conf env " +
  "html htm css js mjs ts jsx tsx py java c h cpp cs go rs php rb lua sh bat ps1 sql kt swift vb gs").split(" "));
function ehTexto(a) {
  const mime = a.mime || "";
  if (mime.startsWith("text/") || mime.includes("json") || mime.includes("xml")) return true;
  const i = a.name.lastIndexOf(".");
  return i > 0 && EXT_TEXTO.has(a.name.slice(i + 1).toLowerCase());
}

async function enviarTexto(conteudo) {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const nome = `texto_${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.txt`;
  try {
    await api({ acao: "texto", pasta, nome, mime: "text/plain", conteudo, link: linkDaPasta() }, "POST");
  } catch (e) {
    toast("Erro ao salvar: " + e.message, "erro");
    return false;
  }
  toast("Salvo");
  await carregar();
  return true;
}

const textos = {}; // conteúdo já carregado, por id
function comLinks(texto) {
  return esc(texto).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g,
    u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
}
async function lerTexto(id) {
  if (!(id in textos)) textos[id] = (await api({ acao: "ler", id })).texto;
  return textos[id];
}
async function carregarPrevias() {
  const alvos = [...document.querySelectorAll("[data-previa]")].slice(0, 40);
  await Promise.all(alvos.map(async el => {
    const a = arquivos.find(x => x.id === el.dataset.previa);
    if (!a || a.size > PREVIA_MAX) return;
    try { el.innerHTML = comLinks((await lerTexto(a.id)).slice(0, 600)); }
    catch { el.textContent = "Não foi possível carregar"; }
  }));
}
function abrirPeloEndereco() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id || !document.getElementById("fundo").hidden) return;
  const a = arquivos.find(x => x.id === id);
  if (a && ehTexto(a)) verTexto(a);
}
async function verTexto(a) {
  if (location.hash.slice(1) !== a.id) history.replaceState(null, "", "#" + a.id);
  const fundo = document.getElementById("fundo");
  const pre = document.getElementById("visorTexto");
  document.getElementById("visorNome").textContent = dataHora(a.created);
  pre.textContent = "Carregando…";
  fundo.hidden = false;
  document.body.style.overflow = "hidden";
  try {
    const texto = await lerTexto(a.id);
    pre.innerHTML = comLinks(texto);
    document.getElementById("visorCopiar").onclick = () => copiar(texto, "Texto copiado");
  } catch (e) {
    pre.textContent = "Erro ao abrir: " + e.message;
  }
}
function fecharVisor() {
  document.getElementById("fundo").hidden = true; document.body.style.overflow = "";
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
}
document.getElementById("visorFechar").onclick = fecharVisor;
document.getElementById("fundo").onclick = e => { if (e.target.id === "fundo") fecharVisor(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") fecharVisor(); });

// ---------- início ----------
pasta = lerPasta();
if (API.startsWith("COLE_AQUI")) {
  app.innerHTML = `<div class="home"><div class="marca">Shino</div>
    <p>Falta configurar: cole o endereço do Apps Script na linha <b>const API</b>, no começo do código.</p></div>`;
} else if (pasta) {
  document.title = `${pasta} · Shino`;
  telaPasta();
} else {
  telaInicial();
}
</script>
